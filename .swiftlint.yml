included:
  - Sources
  - Tests
  - UITests
excluded:
  - build
  - DerivedData
  - TestData
disabled_rules:
  - todo
  - trailing_comma
  - multiple_closures_with_trailing_closure
opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
line_length:
  warning: 130
  error: 160
  ignores_comments: true
type_body_length:
  warning: 350
  error: 500
file_length:
  warning: 600
  error: 800
function_body_length:
  warning: 120
  error: 170
identifier_name:
  min_length: 2
  excluded: [id, x, y, w, h, up, ok, db]
