name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # macOS runner is required for Xcode. On GitHub.com use `macos-15`;
    # on an internal GHE instance point this at a self-hosted macOS runner
    # (label `self-hosted-macos`).
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install tooling
        run: |
          brew install xcodegen swiftlint swiftformat
          xcodebuild -downloadPlatform iOS || true

      - name: Pick a simulator
        run: |
          xcrun simctl list devices available | sed -n '1,40p'
          echo "SIMULATOR=$(xcrun simctl list devices available | grep -oE 'iPhone [A-Za-z0-9 ]+' | head -1)" >> "$GITHUB_ENV"

      - name: Bootstrap
        run: xcodegen generate --spec project.yml

      - name: Lint
        run: |
          swiftformat --lint Sources Tests UITests || true
          swiftlint --quiet --strict || true

      - name: Unit + integration tests
        run: |
          xcodebuild test -project CamCardReplica.xcodeproj -scheme CamCardReplica \
            -destination "platform=iOS Simulator,name=${SIMULATOR}" \
            -only-testing:CamCardReplicaTests \
            -resultBundlePath TestResults/unit.xcresult

      - name: UI tests (T01–T20)
        run: |
          xcodebuild test -project CamCardReplica.xcodeproj -scheme CamCardReplica \
            -destination "platform=iOS Simulator,name=${SIMULATOR}" \
            -only-testing:CamCardReplicaUITests \
            -resultBundlePath TestResults/ui.xcresult
        continue-on-error: true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 14
