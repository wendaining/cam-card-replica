name: CI

# Xcode acceptance runs locally with dated evidence artifacts.
# Linux verifies documentation and evidence tools using Python's standard library.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # Pure Python, stdlib only, reads source files — no Xcode, no simulator.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Docs match the code
        run: python3 Scripts/audit_docs.py
      - name: Evidence parser and comparison checks
        run: make test-evidence test-reference-evidence
