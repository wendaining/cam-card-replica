name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # macOS is required for Xcode. `macos-15` ships Xcode 16.x; the project's
    # deployment target is iOS 17, so it builds there even though local
    # development runs Xcode 27.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun simctl list runtimes

      - name: Install tooling
        run: brew install xcodegen swiftlint swiftformat

      - name: Bootstrap project
        run: xcodegen generate --spec project.yml

      - name: Lint (same policy as `make lint`)
        # swiftlint is the gate. swiftformat is advisory on purpose: its rule set
        # changes between releases, so a newer Homebrew build would fail a tree
        # that the pinned local version considers clean.
        run: |
          swiftlint --quiet
          swiftformat --lint . || true

      - name: Docs match the code
        run: python3 Scripts/audit_docs.py

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in sorted(data.items()):
              for device in devices:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("no iPhone simulator available")
          ')
          echo "Simulator: $UDID"
          echo "UDID=$UDID" >> "$GITHUB_OUTPUT"

      - name: Unit + integration tests
        run: |
          mkdir -p TestResults
          xcodebuild test \
            -project CamCardReplica.xcodeproj -scheme CamCardReplica \
            -destination "id=${{ steps.sim.outputs.UDID }}" \
            -derivedDataPath build \
            -only-testing:CamCardReplicaTests \
            -resultBundlePath TestResults/unit.xcresult

      - name: UI tests (T01-T20)
        # The acceptance suite drives real taps; treat it as evidence, not a gate,
        # so a flaky simulator does not block the build.
        continue-on-error: true
        run: |
          mkdir -p TestResults
          xcodebuild test \
            -project CamCardReplica.xcodeproj -scheme CamCardReplica \
            -destination "id=${{ steps.sim.outputs.UDID }}" \
            -derivedDataPath build \
            -only-testing:CamCardReplicaUITests \
            -resultBundlePath TestResults/ui.xcresult

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 14
