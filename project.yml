name: CamCardReplica
options:
  bundleIdPrefix: com.wendaining
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  CamCardReplica:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Fixtures
      # Folder reference so `Bundle.main.url(forResource:subdirectory: "Fixtures")`
      # keeps working inside the app bundle.
      - path: Resources/Fixtures
        type: folder
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: CamCard Replica
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 需要使用相机拍摄名片，照片仅保存在本机。
        NSPhotoLibraryUsageDescription: 需要访问相册以导入名片图片，照片仅保存在本机。
        NSPhotoLibraryAddUsageDescription: 需要保存处理后的名片图片到相册。
        NSContactsUsageDescription: 需要写入联系人以导出名片信息。
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wendaining.CamCardReplica
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - sdk: Contacts.framework
      - sdk: Vision.framework

  CamCardReplicaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: TestData/ground-truth
        type: folder
        buildPhase: resources
      - path: Resources/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: CamCardReplica
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wendaining.CamCardReplicaTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CamCardReplica.app/CamCardReplica
        BUNDLE_LOADER: $(TEST_HOST)

  CamCardReplicaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: CamCardReplica
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wendaining.CamCardReplicaUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CamCardReplica

schemes:
  CamCardReplica:
    build:
      targets:
        CamCardReplica: all
        CamCardReplicaTests: [test]
        CamCardReplicaUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-ui-testing": false
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - CamCardReplica
      targets:
        - CamCardReplicaTests
        - CamCardReplicaUITests
    archive:
      config: Release
